# Cloud build + sign + TestFlight publish for SchoolSync, with no Mac
# required anywhere in the loop. Runs on Codemagic's hosted Mac build
# machines. See CLOUD_BUILD.md for the one-time manual setup this depends on
# (Apple Developer Program enrollment, App Store Connect API key, Codemagic
# account + integration) — none of that can be done from this file.
#
# Codemagic CLI tool commands below (fetch-signing-files, keychain,
# use-profiles, build-ipa) are Codemagic's standard, long-documented pattern
# for natively-signed iOS apps. This hasn't been run against a live
# Codemagic account yet — if a step errors on first run, check Codemagic's
# current docs for that command's exact flags before changing anything else.

workflows:
  ios-testflight:
    name: SchoolSync -> TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60

    # "schoolsync_asc" must match the name you give the App Store Connect API
    # key integration when you add it under Codemagic > Team settings >
    # Integrations > Apple Developer Portal. This is what lets the
    # `app-store-connect` CLI below authenticate without any secrets in this
    # file.
    integrations:
      app_store_connect: schoolsync_asc

    environment:
      # "ios_signing" is a Codemagic environment variable GROUP (Application
      # settings > Environment variables), not the integration above. It must
      # contain a variable named CERTIFICATE_PRIVATE_KEY_B64: an RSA private
      # key (PEM), base64-encoded onto a single line. `fetch-signing-files
      # --create` does NOT generate this key itself — it has to be supplied.
      # Base64-encoded (rather than raw multi-line PEM) specifically so
      # pasting it into a web form has no line breaks to lose — a multi-line
      # secret is an easy way to get silently mangled by a form field. The
      # "Decode certificate private key" step below turns it back into a
      # real PEM file before signing. See CLOUD_BUILD.md for how to generate
      # and add it.
      groups:
        - ios_signing
      vars:
        BUNDLE_ID_APP: "com.rickhanolt.schoolsync"
        BUNDLE_ID_SHARE: "com.rickhanolt.schoolsync.share"
        XCODE_PROJECT: "SchoolSync.xcodeproj"
        XCODE_SCHEME: "SchoolSync"
      xcode: latest

    scripts:
      - name: Install XcodeGen
        script: brew install xcodegen

      - name: Generate Xcode project from project.yml
        script: xcodegen generate

      - name: Set up keychain to store certificates
        script: keychain initialize

      - name: Decode certificate private key
        script: |
          echo "$CERTIFICATE_PRIVATE_KEY_B64" | base64 --decode > /tmp/certificate_private_key.pem
          # Sanity-check it decoded to a real key before signing steps rely on
          # it — fail loudly here rather than get another opaque error later.
          openssl rsa -in /tmp/certificate_private_key.pem -check -noout

      # --create registers the App ID + provisioning profile in the Apple
      # Developer portal automatically if they don't exist yet. It CANNOT
      # create the App Group identifier itself or attach it as a capability
      # on these App IDs — that's a one-time manual step in the Developer
      # portal (see CLOUD_BUILD.md). Without that step done first, this will
      # fail with a capability-mismatch error.
      - name: Fetch signing files for the app
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID_APP" \
            --type IOS_APP_STORE \
            --certificate-key=@file:/tmp/certificate_private_key.pem \
            --create

      - name: Fetch signing files for the share extension
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID_SHARE" \
            --type IOS_APP_STORE \
            --certificate-key=@file:/tmp/certificate_private_key.pem \
            --create

      - name: Add certificates to keychain
        script: keychain add-certificates

      - name: Set up code signing settings on the generated Xcode project
        script: xcode-project use-profiles

      - name: Increment build number to the next TestFlight build
        script: |
          LATEST_BUILD_NUMBER=$(app-store-connect get-latest-app-store-build-number "$BUNDLE_ID_APP")
          agvtool new-version -all $((LATEST_BUILD_NUMBER + 1))

      # --verbose: without it, a failed archive only prints a terse "Failed
      # to archive ..." with no indication of why. With it, the real
      # xcodebuild output (the actual `error:` line) streams into this log.
      - name: Build ipa for distribution
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME" \
            --verbose

      # TEMPORARY diagnostic: App Store Connect rejected the upload saying
      # NSExtensionPointIdentifier is missing from the built
      # SchoolSyncShare.appex Info.plist, but the source SchoolSyncShare/
      # Info.plist clearly has it — something is dropping it between source
      # and the archived binary. Inspect the real built plist instead of
      # guessing why. Remove once the cause is found and fixed.
      - name: DEBUG inspect built share extension Info.plist
        script: |
          IPA_PATH=$(find /Users/builder/clone/build/ios/ipa -name "*.ipa" | head -1)
          echo "IPA: $IPA_PATH"
          TMP_DIR=$(mktemp -d)
          unzip -q "$IPA_PATH" -d "$TMP_DIR"
          PLIST_PATH=$(find "$TMP_DIR" -path "*SchoolSyncShare.appex/Info.plist")
          echo "Extension Info.plist: $PLIST_PATH"
          plutil -p "$PLIST_PATH"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
