name: SchoolSync
options:
  bundleIdPrefix: com.rickhanolt
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    # VERSIONING_SYSTEM + CURRENT_PROJECT_VERSION let `agvtool` bump the build
    # number, which Codemagic's TestFlight publishing step does automatically
    # before each archive.
    VERSIONING_SYSTEM: apple-generic
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "1.0"
    # Manual signing is required for Codemagic's `xcode-project use-profiles`
    # step to actually take effect. It injects a specific provisioning
    # profile + certificate as build setting overrides, but Xcode only
    # honors those when the target isn't set to resolve signing itself —
    # left on Xcode's default "Automatic", `xcodebuild archive` tries to
    # pick a profile interactively, which has no way to succeed in a
    # headless CI shell and fails with a generic "Failed to archive" error.
    CODE_SIGN_STYLE: Manual

packages:
  SwiftSoup:
    url: https://github.com/scinfu/SwiftSoup.git
    from: "2.7.1"

targets:
  SchoolSync:
    type: application
    platform: iOS
    sources:
      - path: SchoolSync
      - path: Shared
    # XcodeGen does NOT use info.path as an existing file's content — it
    # generates a fresh Info.plist from its own built-in defaults merged
    # with `properties` below, and overwrites whatever's on disk at `path`
    # every run. Any key not listed here (and not one of XcodeGen's own
    # defaults, like CFBundleIdentifier/CFBundleExecutable/etc.) is silently
    # absent from the built app — this is what caused calendar permission
    # keys to go missing from every build so far.
    info:
      path: SchoolSync/Info.plist
      properties:
        CFBundleDisplayName: SchoolSync
        LSRequiresIPhoneOS: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSCalendarsFullAccessUsageDescription: "SchoolSync writes each kid's school events into a dedicated calendar so you can see everything alongside your other calendars."
        NSCalendarsUsageDescription: "SchoolSync writes each kid's school events into a dedicated calendar so you can see everything alongside your other calendars."
        # The app implements no encryption itself — only standard HTTPS via
        # URLSession (OS-provided TLS) for fetching ICS feeds/scraping school
        # pages, and SHA256 for non-secret dedup hashing, not confidentiality.
        # That's Apple's "exempt" category; declaring it here skips the
        # export-compliance question on every future TestFlight upload.
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: SchoolSync/SchoolSync.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.rickhanolt.schoolsync
    dependencies:
      - package: SwiftSoup
      - target: SchoolSyncShare
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rickhanolt.schoolsync
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  SchoolSyncShare:
    type: app-extension
    platform: iOS
    sources:
      - path: SchoolSyncShare
      - path: Shared
    # See the comment on SchoolSync's `info` above — XcodeGen regenerates
    # this file from `properties` every run rather than using an existing
    # physical file's content. This is where the NSExtensionPointIdentifier
    # / CFBundleDisplayName App Store Connect rejection actually came from.
    info:
      path: SchoolSyncShare/Info.plist
      properties:
        CFBundleDisplayName: Add to SchoolSync
        NSExtension:
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsAttachmentsWithMaxCount: 1
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionPointIdentifier: com.apple.share-services
    entitlements:
      path: SchoolSyncShare/SchoolSyncShare.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.rickhanolt.schoolsync
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rickhanolt.schoolsync.share
        TARGETED_DEVICE_FAMILY: "1"
