name: SchoolSync
options:
  bundleIdPrefix: com.rickhanolt
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    # VERSIONING_SYSTEM + CURRENT_PROJECT_VERSION let `agvtool` bump the build
    # number, which Codemagic's TestFlight publishing step does automatically
    # before each archive.
    VERSIONING_SYSTEM: apple-generic
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "1.0"
    # Manual signing is required for Codemagic's `xcode-project use-profiles`
    # step to actually take effect. It injects a specific provisioning
    # profile + certificate as build setting overrides, but Xcode only
    # honors those when the target isn't set to resolve signing itself —
    # left on Xcode's default "Automatic", `xcodebuild archive` tries to
    # pick a profile interactively, which has no way to succeed in a
    # headless CI shell and fails with a generic "Failed to archive" error.
    CODE_SIGN_STYLE: Manual
    # App Store Connect rejected the SchoolSyncShare upload: "the
    # NSExtensionPointIdentifier key must be present in the NSExtension
    # dictionary" — even though SchoolSyncShare/Info.plist clearly has it.
    # Recent Xcode defaults extension targets to synthesizing Info.plist
    # from build settings (GENERATE_INFOPLIST_FILE=YES) rather than using a
    # physical file as-is, and that synthesis has no way to produce a
    # complex nested key like NSExtension — it silently drops it. Forcing
    # this off makes Xcode use the real file's content unmodified.
    GENERATE_INFOPLIST_FILE: NO

packages:
  SwiftSoup:
    url: https://github.com/scinfu/SwiftSoup.git
    from: "2.7.1"

targets:
  SchoolSync:
    type: application
    platform: iOS
    sources:
      - path: SchoolSync
      - path: Shared
    info:
      path: SchoolSync/Info.plist
    entitlements:
      path: SchoolSync/SchoolSync.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.rickhanolt.schoolsync
    dependencies:
      - package: SwiftSoup
      - target: SchoolSyncShare
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rickhanolt.schoolsync
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  SchoolSyncShare:
    type: app-extension
    platform: iOS
    sources:
      - path: SchoolSyncShare
      - path: Shared
    info:
      path: SchoolSyncShare/Info.plist
    entitlements:
      path: SchoolSyncShare/SchoolSyncShare.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.rickhanolt.schoolsync
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rickhanolt.schoolsync.share
        TARGETED_DEVICE_FAMILY: "1"
